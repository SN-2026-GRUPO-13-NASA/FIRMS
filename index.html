<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel NASA FIRMS - Monitoramento de Incêndios</title>
    <!-- Vinculação do CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>🔥 Painel de Detecção de Incêndios (NASA FIRMS)</h1>
        <div class="status-card">
            Última Atualização do Pipeline: <span id="last-update">Carregando...</span>
        </div>
    </header>

    <div class="controls">
        <label for="sat-filter">Filtrar por Satélite:</label>
        <select id="sat-filter" onchange="applyFilter()">
            <option value="ALL">Todos os Satélites</option>
            <option value="N">VIIRS (SNPP / NOAA)</option>
            <option value="T">Terra (MODIS)</option>
            <option value="A">Aqua (MODIS)</option>
        </select>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Hora (UTC)</th>
                    <th>Latitude</th>
                    <th>Longitude</th>
                    <th>Satélite</th>
                    <th>Confiança</th>
                    <th>FRP (MW)</th>
                </tr>
            </thead>
            <tbody id="data-table">
                <tr><td colspan="7" style="text-align: center;">Carregando registros...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Configuração das Credenciais Públicas do Supabase
    // Substitua com a URL do seu projeto e a sua 'anon' key do Supabase!
    const SUPABASE_URL = "https://SEU-PROJETO.supabase.co";
    const SUPABASE_ANON_KEY = "SUA_CHAVE_ANON_AQUI";

    let globalData = [];

    // Função de sanitização obrigatória (Item 3.6 do Edital)
    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // Busca a última execução registrada na tabela 'execucoes'
    async function loadLastExecution() {
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/execucoes?select=data_execucao,status&order=data_execucao.desc&limit=1`, {
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                }
            });
            const data = await response.json();
            
            if (data && data.length > 0) {
                const exec = data[0];
                const dateObj = new Date(exec.data_execucao);
                const formattedDate = dateObj.toLocaleString('pt-BR');
                const statusClass = exec.status === 'concluido' ? 'status-concluido' : 'status-erro';
                
                document.getElementById('last-update').innerHTML = `
                    ${escapeHtml(formattedDate)} 
                    <span class="status-tag ${statusClass}">${escapeHtml(exec.status)}</span>
                `;
            } else {
                document.getElementById('last-update').innerText = "Nenhuma execução registrada.";
            }
        } catch (err) {
            document.getElementById('last-update').innerText = "Erro ao carregar execução.";
        }
    }

    // Busca os focos de incêndio registrados na tabela 'firms_data'
    async function loadFirmsData() {
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/firms_data?select=*&order=acq_date.desc,acq_time.desc&limit=100`, {
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                }
            });
            globalData = await response.json();
            renderTable(globalData);
        } catch (err) {
            document.getElementById('data-table').innerHTML = `<tr><td colspan="7" style="text-align: center; color: red;">Erro ao carregar dados do Supabase.</td></tr>`;
        }
    }

    // Renderiza a tabela com proteção contra XSS (escapeHtml)
    function renderTable(data) {
        const tbody = document.getElementById('data-table');
        tbody.innerHTML = '';

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">Nenhum registro encontrado.</td></tr>';
            return;
        }

        data.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${escapeHtml(row.acq_date)}</td>
                <td>${escapeHtml(row.acq_time)}</td>
                <td>${escapeHtml(row.latitude)}</td>
                <td>${escapeHtml(row.longitude)}</td>
                <td>${escapeHtml(row.satellite)}</td>
                <td>${escapeHtml(row.confidence)}</td>
                <td>${escapeHtml(row.frp)}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Filtro interativo no lado do cliente
    function applyFilter() {
        const selectedSat = document.getElementById('sat-filter').value;
        if (selectedSat === 'ALL') {
            renderTable(globalData);
        } else {
            const filtered = globalData.filter(item => item.satellite && item.satellite.includes(selectedSat));
            renderTable(filtered);
        }
    }

    // Inicialização ao carregar a página
    loadLastExecution();
    loadFirmsData();
</script>

</body>
</html>
